<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SnakeBench — Decision Logs</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh;
        font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
        background: radial-gradient(1200px 800px at 50% 0%, #14304a, #06101b 70%);
        color: #eaf4fb;
      }
      header {
        padding: 18px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
        border-bottom: 1px solid rgba(120,180,220,0.15);
      }
      h1 { font-size: 18px; margin: 0 12px 0 0; }
      a { color: #5fd0ff; }
      input, button {
        font: inherit; border-radius: 9px; border: 1px solid rgba(120,180,220,0.3);
        background: rgba(13,32,48,0.7); color: #eaf4fb; padding: 8px 12px;
      }
      input { min-width: 320px; }
      button { cursor: pointer; font-weight: 600; }
      button:hover { border-color: #5fd0ff; }
      button.danger { border-color: rgba(255,120,120,0.5); color: #ff9b9b; }
      .meta { color: #8fb6cd; margin-left: auto; }
      main { padding: 16px 24px 48px; }
      .entry {
        border: 1px solid rgba(120,180,220,0.15); border-radius: 12px;
        background: rgba(11,30,44,0.5); margin-bottom: 10px; overflow: hidden;
      }
      .entry summary {
        cursor: pointer; padding: 10px 14px; display: flex; gap: 14px; align-items: center;
        list-style: none;
      }
      .entry summary::-webkit-details-marker { display: none; }
      .pill { font-variant-numeric: tabular-nums; }
      .pill.move { font-weight: 700; color: #ffd54a; text-transform: uppercase; width: 56px; }
      .pill.intent { color: #9fe6c2; text-transform: uppercase; letter-spacing: .3px; }
      .pill.tick { color: #9fc6dc; width: 110px; }
      .pill.lat { color: #7fd6a0; width: 90px; }
      .body { padding: 0 14px 14px; }
      .body h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #7ba3bc; margin: 12px 0 4px; }
      pre {
        margin: 0; padding: 10px 12px; border-radius: 8px; background: #08131f;
        border: 1px solid rgba(120,180,220,0.12); overflow: auto; max-height: 320px;
        font: 12px/1.45 ui-monospace, "Cascadia Code", Consolas, monospace; color: #cfe6f4; white-space: pre-wrap;
      }
      .muted { color: #6f97ae; }
      .err { color: #ff9b9b; }
    </style>
  </head>
  <body>
    <header>
      <h1>Decision Logs</h1>
      <button id="load">Reload</button>
      <button id="del" class="danger">Delete all my logs</button>
      <span class="meta" id="meta"><a href="/account.html">← account</a> · <a href="/">spectator</a></span>
    </header>
    <main id="out"><p class="muted">Loading your decision history…</p></main>

    <script>
      const $ = (id) => document.getElementById(id);
      const out = $("out");

      function esc(s) {
        return String(s).replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      function summariseView(v) {
        if (!v) return "(no view captured)";
        const you = v.you || {};
        return [
          `tick ${v.tick}`,
          `len ${you.length}`,
          `combo ${you.combo}`,
          `frenzy ${you.frenzy_ticks_left}`,
          `food ${(v.food || []).length}`,
          `obstacles ${(v.obstacles || []).length}`,
          `powerups ${(v.power_ups || []).length}`,
          `rivals ${(v.snakes || []).length}`,
        ].join(" · ");
      }

      async function load() {
        out.innerHTML = `<p class="muted">Loading…</p>`;
        let data;
        try {
          const r = await fetch(`/api/logs?limit=500`, { credentials: "same-origin" });
          data = await r.json();
          if (r.status === 401) {
            out.innerHTML = `<p class="err">Please <a href="/account.html">sign in</a> to view your logs.</p>`;
            return;
          }
          if (!r.ok) { out.innerHTML = `<p class="err">${esc(data.error || r.status)}</p>`; return; }
        } catch (e) { out.innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }

        if (!data.entries.length) {
          out.innerHTML = `<p class="muted">No decisions logged yet for <b>${esc(data.account)}</b>.</p>`;
          return;
        }
        let html = `<p class="muted">Account <b>${esc(data.account)}</b> — showing ${data.entries.length} of ${data.total} decisions (newest first).</p>`;
        for (const e of data.entries) {
          const ev = e.evidence || {};
          html +=
            `<details class="entry"><summary>` +
            `<span class="pill move">${esc(e.move)}</span>` +
            `<span class="pill intent">${e.intent ? esc(e.intent) : "undeclared"}</span>` +
            (e.target ? `<span class="muted">→ ${esc(e.target)}</span> ` : "") +
            `<span class="pill tick">R${e.round} · t${e.tick}</span>` +
            `<span class="pill lat">${e.latencyMs == null ? "–" : e.latencyMs + "ms"}</span>` +
            `<span class="muted">${new Date(e.ts).toLocaleTimeString()}</span>` +
            `</summary><div class="body">` +
            `<h3>State the decision was based on</h3><pre>${esc(summariseView(e.view))}</pre>` +
            (ev.prompt ? `<h3>Prompt</h3><pre>${esc(ev.prompt)}</pre>` : "") +
            (ev.response ? `<h3>Model response</h3><pre>${esc(ev.response)}</pre>` : "") +
            (ev.model ? `<p class="muted">model: ${esc(ev.model)}</p>` : "") +
            `<h3>Raw view JSON</h3><pre>${esc(JSON.stringify(e.view, null, 2))}</pre>` +
            `</div></details>`;
        }
        out.innerHTML = html;
      }

      async function del() {
        if (!confirm("Delete ALL decision logs for this account? This cannot be undone.")) return;
        try {
          const r = await fetch(`/api/logs`, { method: "DELETE", credentials: "same-origin" });
          const data = await r.json();
          if (!r.ok) { out.innerHTML = `<p class="err">${esc(data.error || r.status)}</p>`; return; }
          out.innerHTML = `<p class="muted">${data.deleted ? "Deleted all logs" : "No logs to delete"} for <b>${esc(data.account)}</b>.</p>`;
        } catch (e) { out.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
      }

      $("load").onclick = load;
      $("del").onclick = del;
      load();
    </script>
  </body>
</html>
