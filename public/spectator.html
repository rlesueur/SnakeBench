<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SnakeBench — Spectator</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
        overflow: hidden;
        background: radial-gradient(1400px 1000px at 50% 28%, #14304a, #06101b 72%);
        color: #eaf4fb;
        user-select: none;
      }
      #board { display: block; position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; }
      #board.dragging { cursor: grabbing; }

      /* Soft vignette over everything to frame the view. */
      #vignette {
        position: fixed; inset: 0; z-index: 1; pointer-events: none;
        box-shadow: inset 0 0 240px 40px rgba(0, 0, 0, 0.55);
      }

      .overlay { position: fixed; z-index: 2; }
      #hud {
        top: 16px; left: 16px;
        display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      }
      .chip {
        background: rgba(13, 32, 48, 0.6);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(120, 180, 220, 0.22);
        border-radius: 999px;
        padding: 6px 14px;
        font-weight: 600;
        color: #d6ecf8;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      }
      .chip b { color: #5fd0ff; }
      .chip.title { font-size: 15px; letter-spacing: .2px; }
      a.chip.link { text-decoration: none; color: #bfe0ff; cursor: pointer; }
      a.chip.link:hover { border-color: #5fd0ff; color: #eaf4fb; }
      #followChip { display: none; gap: 8px; align-items: center; }
      #followChip.on { display: inline-flex; }
      #followChip .x { cursor: pointer; opacity: .7; font-weight: 700; }
      #followChip .x:hover { opacity: 1; }

      /* Right-hand column: live + all-time boards stacked */
      #rightCol {
        top: 16px; right: 16px; width: 280px;
        display: flex; flex-direction: column; gap: 12px;
        max-height: calc(100vh - 32px);
      }
      .card {
        background: rgba(11, 30, 44, 0.62);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 12px 12px 8px;
        color: #eaf4fb;
        box-shadow: 0 10px 40px rgba(10, 30, 50, 0.35);
        overflow: hidden auto;
      }
      #ruleCard { flex: 0 0 auto; padding-bottom: 10px; }
      #lbCard { flex: 1 1 auto; min-height: 120px; }
      #statsCard { flex: 0 0 auto; max-height: 38%; }

      /* Active rule card */
      .ruleName { font-size: 16px; font-weight: 800; color: #ffd54a; margin: 0 6px 5px; letter-spacing: .2px; }
      .ruleBrief { font-size: 12px; color: #cfe6f4; margin: 0 6px 9px; line-height: 1.45; }
      .modBrief { color: #ffcf6b; }
      .pills { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 6px; }
      .pill {
        font-size: 10px; letter-spacing: .3px; padding: 2px 8px; border-radius: 999px;
        background: rgba(95, 178, 255, 0.16); border: 1px solid rgba(95, 178, 255, 0.32);
        color: #cfe6f4; text-transform: uppercase; white-space: nowrap;
      }
      .pill.warn { background: rgba(255, 143, 143, 0.16); border-color: rgba(255, 143, 143, 0.42); color: #ffc9c9; }
      .card h2 {
        margin: 2px 6px 10px; font-size: 12px; letter-spacing: .6px;
        text-transform: uppercase; color: #9fc6dc;
        display: flex; justify-content: space-between; align-items: baseline;
      }
      .card h2 .hint { font-weight: 600; color: #6f97ae; text-transform: none; letter-spacing: 0; font-size: 10px; }

      .strow {
        display: flex; align-items: center; gap: 8px;
        padding: 4px 8px; border-radius: 8px; font-size: 13px;
      }
      .strow.head { color: #7ba3bc; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; padding-bottom: 2px; }
      .strow .rk { width: 16px; text-align: right; color: #8fb6cd; font-variant-numeric: tabular-nums; }
      .strow .nm { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .strow .v { width: 34px; text-align: right; font-variant-numeric: tabular-nums; }
      .strow .v.win { color: #ffd54a; font-weight: 700; }
      .strow .v.max { color: #5fd0ff; }
      .strow:not(.head):nth-child(even) { background: rgba(255,255,255,0.03); }
      .lbrow {
        display: flex; align-items: center; gap: 9px;
        padding: 5px 8px; border-radius: 10px; margin-bottom: 2px; cursor: pointer;
      }
      .lbrow:hover { background: rgba(120, 180, 220, 0.12); }
      .lbrow.followed { background: rgba(95, 178, 255, 0.22); box-shadow: inset 0 0 0 1px rgba(95,178,255,.4); }
      .lbrow.dead { opacity: .42; }
      .lbrow .rk { width: 16px; text-align: right; color: #8fb6cd; font-variant-numeric: tabular-nums; }
      .lbrow .sw { width: 11px; height: 11px; border-radius: 50%; flex: none; box-shadow: 0 0 8px -1px currentColor; }
      .lbrow .nm { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .lbrow .ai { font-size: 9px; padding: 1px 6px; border-radius: 999px; background: rgba(95,178,255,.25); color: #bfe0ff; letter-spacing: .4px; }
      .lbrow .sz { font-variant-numeric: tabular-nums; color: #cfe6f4; }
      .lbpager {
        display: none; align-items: center; justify-content: center; gap: 10px;
        margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.08);
      }
      .lbpager .pginfo { font-size: 11px; color: #9fc6dc; font-variant-numeric: tabular-nums; }
      .pgbtn {
        background: rgba(95,178,255,0.14); border: 1px solid rgba(95,178,255,0.3);
        color: #cfe6f4; border-radius: 8px; width: 26px; height: 22px; cursor: pointer;
        font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center;
      }
      .pgbtn:hover:not(:disabled) { background: rgba(95,178,255,0.28); }
      .pgbtn:disabled { opacity: .35; cursor: default; }

      /* Live kill / commentary feed, lower-left above the legend */
      #feed {
        bottom: 58px; left: 16px; width: 320px;
        display: flex; flex-direction: column-reverse; gap: 5px;
        pointer-events: none;
      }
      .feedrow {
        background: rgba(11, 30, 44, 0.62);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-left-width: 3px;
        border-radius: 8px;
        padding: 5px 10px; font-size: 12.5px; color: #dceaf4;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        animation: feedIn .25s ease-out;
        transition: opacity .6s;
      }
      .feedrow b { color: #eaf4fb; }
      .feedrow.kill { border-left-color: #ffd54a; }
      .feedrow.death { border-left-color: #ff6b6b; }
      .feedrow.frenzy { border-left-color: #a06bff; }
      .feedrow.say { border-left-color: #5fd0ff; color: #bfe0ff; }
      @keyframes feedIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }

      /* All-time rating delta chips */
      .strow .dlt { width: 30px; text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; }
      .strow .dlt.up { color: #5fe39b; }
      .strow .dlt.down { color: #ff7b7b; }
      .strow .dlt.flat { color: #5a7689; }

      /* Legend / status, bottom-left */
      #foot { bottom: 16px; left: 16px; display: flex; gap: 8px; align-items: center; }
      .dotleg { display: inline-flex; align-items: center; gap: 5px; }
      .dotleg i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

      /* Camera controls — left rail below the minimap, clear of the scoreboard. */
      #controls {
        left: 16px; top: 276px;
        display: flex; flex-direction: column; gap: 6px; align-items: stretch;
      }
      .btn {
        min-width: 44px; height: 36px; padding: 0 10px;
        background: rgba(13, 32, 48, 0.7);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(120, 180, 220, 0.25);
        border-radius: 10px;
        color: #d6ecf8; font-weight: 700; font-size: 13px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      }
      .btn:hover { background: rgba(28, 56, 80, 0.85); border-color: rgba(95, 208, 255, 0.5); }
      .btn:active { transform: translateY(1px); }
      .btn.zoom { font-size: 18px; }

      /* Minimap, top-left rail — stacked above camera controls (#controls). */
      #miniWrap {
        left: 16px; top: 88px;
        padding: 8px; border-radius: 12px;
        background: rgba(8, 20, 32, 0.66);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(120, 180, 220, 0.22);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
      }
      #minimap { display: block; cursor: pointer; border-radius: 6px; }
    </style>
  </head>
  <body>
    <canvas id="board"></canvas>
    <div id="vignette"></div>

    <div id="hud" class="overlay">
      <span class="chip title">SnakeBench</span>
      <a class="chip link" href="/account.html">Sign in / Account</a>
      <a class="chip link" href="/guide.html">How to play</a>
      <a class="chip link" href="/faq.html">Rules &amp; FAQ</a>
      <span class="chip">Round <b id="round">–</b> · Tick <b id="tick">0</b> · <b id="alive">0</b> alive</span>
      <span class="chip" id="deliberateChip" style="display:none">⏳ <b id="delibInfo">–</b></span>
      <span class="chip" id="followChip">Following <b id="followName">–</b><span class="x" id="unfollow">✕</span></span>
    </div>

    <div id="rightCol" class="overlay">
      <div id="ruleCard" class="card">
        <h2>Rules this round</h2>
        <div id="ruleName" class="ruleName">—</div>
        <div id="ruleBrief" class="ruleBrief"></div>
        <div id="rulePills" class="pills"></div>
      </div>
      <div id="lbCard" class="card">
        <h2>This round <span id="lbMetric" class="hint">click to follow</span></h2>
        <div id="leaderboard"></div>
        <div id="lbPager" class="lbpager"></div>
      </div>
      <div id="statsCard" class="card">
        <h2>All-time <span class="hint">skill rating · decision quality</span></h2>
        <div id="stats"></div>
        <div id="statsPager" class="lbpager"></div>
      </div>
    </div>

    <div id="feed" class="overlay"></div>

    <div id="foot" class="overlay">
      <span class="chip" id="status">Connecting…</span>
      <span class="chip">
        <span class="dotleg"><i style="background:#ffe34d;box-shadow:0 0 8px #ffe34d"></i>food +1</span>&nbsp;
        <span class="dotleg"><i style="background:#ff8f3a;box-shadow:0 0 8px #ff8f3a"></i>+3</span>&nbsp;
        <span class="dotleg"><i style="background:#ff4fd8;box-shadow:0 0 8px #ff4fd8"></i>+6</span>&nbsp;
        <span class="dotleg"><i style="background:#37506a;border-radius:2px"></i>obstacle</span>
        <span id="legdyn"></span>
      </span>
    </div>

    <div id="controls" class="overlay">
      <button class="btn" id="btnFull" title="Fill screen (C)">Fill</button>
      <button class="btn" id="btnFit" title="Fit whole board (F)">Fit</button>
      <button class="btn zoom" id="btnIn" title="Zoom in (+)">+</button>
      <button class="btn zoom" id="btnOut" title="Zoom out (−)">−</button>
    </div>

    <div id="miniWrap" class="overlay">
      <canvas id="minimap" width="160" height="160"></canvas>
    </div>

    <script>
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const mini = document.getElementById("minimap");
      const mctx = mini.getContext("2d");
      const els = {
        round: document.getElementById("round"),
        tick: document.getElementById("tick"),
        alive: document.getElementById("alive"),
        lb: document.getElementById("leaderboard"),
        lbPager: document.getElementById("lbPager"),
        stats: document.getElementById("stats"),
        statsPager: document.getElementById("statsPager"),
        status: document.getElementById("status"),
        followChip: document.getElementById("followChip"),
        followName: document.getElementById("followName"),
        feed: document.getElementById("feed"),
        ruleName: document.getElementById("ruleName"),
        ruleBrief: document.getElementById("ruleBrief"),
        rulePills: document.getElementById("rulePills"),
        deliberateChip: document.getElementById("deliberateChip"),
        delibInfo: document.getElementById("delibInfo"),
      };
      let currentRules = null;

      let world = { width: 200, height: 200 };
      let obstacles = [];
      let prev = null;   // previous frame (for interpolation)
      let cur = null;    // latest frame
      let tickMs = 2000; // measured gap between frames (legacy; kept for minimap timing)
      let follow = null; // snake id to follow, or null
      // Live "deliberation" beat: which agents are thinking this window, who has
      // locked in, and the ceiling — set on a `deliberation` msg, cleared on the
      // next frame (the reveal). Drives the thinking rings + HUD countdown.
      let think = null;  // { tick, ceiling, start, ids:Set, names:Map, locked:Set }
      // Moves are revealed crisply over REVEAL_MS, then the board HOLDS for the
      // rest of the (variable) window while agents think — instead of smearing one
      // cell of motion across the whole 10s. This is the pipelined reveal.
      const REVEAL_MS = 420;
      const easeOut = (t) => 1 - Math.pow(1 - t, 3);

      const trunc = (s, n) => (s && s.length > n ? s.slice(0, n - 1) + "…" : s || "");

      // Camera: cam.x/cam.y is the world cell at screen centre; cam.scale = px/cell.
      let cam = { x: 100, y: 100, scale: 6 };
      let camT = { x: 100, y: 100, scale: 6 };
      let mode = "full"; // full | fit | follow | free
      let camReady = false;
      let W = 0, H = 0, DPR = 1;

      // FNV-1a hash → well-spread, stable colour per snake id.
      function hashId(id) {
        let h = 2166136261;
        for (let i = 0; i < id.length; i++) {
          h ^= id.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }
      const colCache = new Map();
      function colsFor(id) {
        let c = colCache.get(id);
        if (c) return c;
        const hsh = hashId(id);
        const hue = hsh % 360;
        const sat = 68 + (hsh >>> 9) % 24;        // 68–92%
        const light = 52 + (((hsh >>> 17) % 3) - 1) * 7; // 45/52/59% for extra separation
        c = {
          body: `hsl(${hue},${sat}%,${light}%)`,
          dark: `hsl(${hue},${Math.min(95, sat)}%,${light - 18}%)`,
          head: `hsl(${hue},${Math.min(98, sat + 8)}%,${light + 12}%)`,
        };
        colCache.set(id, c);
        return c;
      }
      const bodyCol = (id) => colsFor(id).body;
      const darkCol = (id) => colsFor(id).dark;
      const headCol = (id) => colsFor(id).head;
      function foodStyle(v) {
        if (v >= 10) return { col: "#ffd700", r: 0.85 }; // golden apple
        if (v >= 6) return { col: "#ff4fd8", r: 0.62 };
        if (v >= 3) return { col: "#ff8f3a", r: 0.52 };
        return { col: "#ffe34d", r: 0.42 };
      }
      const lerp = (a, b, t) => a + (b - a) * t;

      // --- coordinate transforms (use cam) ---
      const sx = (wx) => (wx - cam.x) * cam.scale + W / 2;
      const sy = (wy) => (wy - cam.y) * cam.scale + H / 2;
      const worldX = (px) => (px - W / 2) / cam.scale + cam.x;
      const worldY = (py) => (py - H / 2) / cam.scale + cam.y;

      function coverScale() { return Math.max(W / world.width, H / world.height); }
      function fitScale() { return Math.min(W / world.width, H / world.height) * 0.98; }

      function applyMode() {
        if (mode === "full") {
          camT.scale = coverScale();
          camT.x = world.width / 2;
          camT.y = world.height / 2;
        } else if (mode === "fit") {
          camT.scale = fitScale();
          camT.x = world.width / 2;
          camT.y = world.height / 2;
        } else if (mode === "follow" && cur) {
          const s = cur.snakes.find((s) => s.id === follow && s.alive && s.body.length);
          if (s) {
            const p = interpHead(s);
            camT.x = p.x;
            camT.y = p.y;
          } else {
            setMode("full");
          }
        }
        // 'free' leaves camT alone (driven by user input).
      }

      function setMode(m) {
        mode = m;
        if (m !== "follow") {
          follow = null;
          els.followChip.classList.remove("on");
        }
        applyMode();
        if (!camReady) { cam = { ...camT }; camReady = true; }
      }

      function setFollow(id) {
        const s = cur && cur.snakes.find((s) => s.id === id);
        if (!s) return;
        follow = id;
        mode = "follow";
        els.followName.textContent = s.displayName;
        els.followChip.classList.add("on");
        renderLeaderboard();
      }

      function resize() {
        DPR = window.devicePixelRatio || 1;
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        applyMode();
      }

      // --- interpolation between ticks ---
      function interpT() {
        if (!cur) return 1;
        const raw = Math.max(0, Math.min(1, (performance.now() - cur.recvT) / REVEAL_MS));
        return easeOut(raw);
      }
      function interpHead(s) {
        const t = interpT();
        const c = s.body[0];
        let px = c, py = c;
        const ps = prev && prev.byId ? prev.byId.get(s.id) : null;
        const p = ps && ps.body.length ? ps.body[0] : c;
        return { x: lerp(p.x, c.x, t) + 0.5, y: lerp(p.y, c.y, t) + 0.5 };
      }
      function interpBody(s) {
        const t = interpT();
        const ps = prev && prev.byId ? prev.byId.get(s.id) : null;
        return s.body.map((c, i) => {
          const p = ps && ps.body.length ? (ps.body[i] ?? ps.body[ps.body.length - 1]) : c;
          return { x: lerp(p.x, c.x, t) + 0.5, y: lerp(p.y, c.y, t) + 0.5 };
        });
      }

      // --- main render loop ---
      function tickCamera() {
        if (mode !== "free") applyMode();
        const k = mode === "follow" ? 0.18 : 0.2;
        cam.x = lerp(cam.x, camT.x, k);
        cam.y = lerp(cam.y, camT.y, k);
        cam.scale = lerp(cam.scale, camT.scale, 0.2);
      }

      function loop() {
        tickCamera();
        draw();
        drawMinimap();
        requestAnimationFrame(loop);
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        // Board panel (world bounds) drawn in screen space.
        const bx = sx(0), by = sy(0);
        const bw = world.width * cam.scale, bh = world.height * cam.scale;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, Math.min(16, cam.scale * 2));
        const g = ctx.createRadialGradient(bx + bw / 2, by + bh * 0.4, 0, bx + bw / 2, by + bh * 0.4, Math.max(bw, bh));
        g.addColorStop(0, "#10283e");
        g.addColorStop(0.6, "#0b1d2d");
        g.addColorStop(1, "#06121e");
        ctx.fillStyle = g;
        ctx.fill();
        ctx.clip();
        drawHoneycomb(bx, by, bw, bh);

        // Scoring zone ("zone" objective) — a glowing region you score by occupying.
        const zone = currentRules && currentRules.zone;
        if (zone) {
          const zx = sx(zone.x), zy = sy(zone.y);
          const zw = zone.w * cam.scale, zh = zone.h * cam.scale;
          const pulse = 0.10 + 0.06 * Math.sin(performance.now() / 400);
          ctx.save();
          ctx.fillStyle = `rgba(86,204,242,${pulse})`;
          ctx.fillRect(zx, zy, zw, zh);
          ctx.strokeStyle = "rgba(86,204,242,0.85)";
          ctx.lineWidth = Math.max(1.5, cam.scale * 0.18);
          ctx.setLineDash([cam.scale * 0.8, cam.scale * 0.5]);
          ctx.strokeRect(zx, zy, zw, zh);
          ctx.restore();
        }

        // Waypoints ("relay" objective) — numbered markers along the route.
        const wps = currentRules && currentRules.waypoints;
        if (wps && wps.length) {
          const r = Math.max(3, cam.scale * 0.5);
          ctx.save();
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.font = `${Math.max(8, Math.round(cam.scale * 0.8))}px system-ui`;
          for (let i = 0; i < wps.length; i++) {
            const x = sx(wps[i].x + 0.5), y = sy(wps[i].y + 0.5);
            ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
            ctx.fillStyle = "rgba(255,210,74,0.22)"; ctx.fill();
            ctx.strokeStyle = "#ffd24a"; ctx.lineWidth = Math.max(1, cam.scale * 0.12); ctx.stroke();
            if (cam.scale >= 5) { ctx.fillStyle = "#ffe9a8"; ctx.fillText(String(i + 1), x, y + 0.5); }
          }
          ctx.restore();
        }

        // Tidal Pull beacon ("cadence" law): on the law's cadence ticks every
        // snake must move strictly closer to this cell or die. Marked with
        // rippling teal "tide" rings + a label so spectators can see the pull point.
        const laws = (currentRules && currentRules.laws) || [];
        for (const law of laws) {
          if (law.kind !== "cadence" || !law.anchor) continue;
          const x = sx(law.anchor.x + 0.5), y = sy(law.anchor.y + 0.5);
          const t = performance.now() / 1000;
          ctx.save();
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          const baseR = Math.max(7, cam.scale * 1.6);
          for (let k = 0; k < 3; k++) {
            const phase = (t * 0.55 + k / 3) % 1; // rings ripple inward toward the beacon
            const rr = baseR * (1.35 - phase);
            if (rr <= 0) continue;
            ctx.beginPath(); ctx.arc(x, y, rr, 0, 7);
            ctx.strokeStyle = `rgba(110,205,255,${0.55 * (1 - phase)})`;
            ctx.lineWidth = Math.max(1, cam.scale * 0.14);
            ctx.stroke();
          }
          ctx.beginPath(); ctx.arc(x, y, Math.max(2.5, cam.scale * 0.42), 0, 7);
          ctx.shadowColor = "#7dd3ff"; ctx.shadowBlur = cam.scale;
          ctx.fillStyle = "#9fe2ff"; ctx.fill();
          if (cam.scale >= 4) {
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#cfefff";
            ctx.font = `700 ${Math.max(8, Math.round(cam.scale * 0.62))}px 'Segoe UI', system-ui, sans-serif`;
            ctx.fillText("TIDE", x, y - baseR * 1.2);
          }
          ctx.restore();
        }

        // Obstacles — solid slate blocks with an edge and top highlight so they read as walls.
        if (obstacles.length) {
          const og = Math.max(0.4, cam.scale * 0.06);
          const sz = cam.scale - og;
          ctx.fillStyle = "#4a6684";
          for (const o of obstacles) ctx.fillRect(sx(o.x), sy(o.y), sz, sz);
          if (cam.scale >= 3) {
            ctx.strokeStyle = "rgba(8,16,26,0.7)";
            ctx.lineWidth = 1;
            for (const o of obstacles) ctx.strokeRect(sx(o.x) + 0.5, sy(o.y) + 0.5, sz - 1, sz - 1);
            ctx.fillStyle = "rgba(180,205,230,0.22)";
            for (const o of obstacles) ctx.fillRect(sx(o.x), sy(o.y), sz, Math.max(1, cam.scale * 0.26));
          }
        }

        if (cur) {
          // Food.
          ctx.save();
          for (const f of cur.food) {
            const st = foodStyle(f.value);
            const r = Math.max(1.4, cam.scale * st.r);
            const x = sx(f.x + 0.5), y = sy(f.y + 0.5);
            ctx.shadowColor = st.col;
            ctx.shadowBlur = r * 2;
            ctx.fillStyle = st.col;
            ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
            if (cam.scale >= 6) {
              ctx.shadowBlur = 0;
              ctx.fillStyle = "rgba(255,255,255,0.75)";
              ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.3, 0, 7); ctx.fill();
            }
          }
          ctx.restore();

          // Snakes.
          for (const s of cur.snakes) {
            if (!s.alive || !s.body.length) continue;
            drawSnake(s);
          }
        }
        ctx.restore();

        // Play-boundary rim.
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, Math.min(16, cam.scale * 2));
        ctx.strokeStyle = "rgba(95,208,255,0.4)";
        ctx.lineWidth = 2;
        ctx.shadowColor = "rgba(95,208,255,0.35)";
        ctx.shadowBlur = 14;
        ctx.stroke();
        ctx.restore();

        if (!cur) return;
        // Name labels (+ combo badge) — only when not too tiny.
        if (cam.scale >= 3) {
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          const notes = cur.notes;
          for (const s of cur.snakes) {
            if (!s.alive || !s.body.length) continue;
            const h = interpHead(s);
            const x = sx(h.x), y = sy(h.y) - cam.scale * 0.7 - 4;
            let label = s.displayName;
            if (s.score != null) label += `  ◆${s.score}`;
            if (s.combo > 1) label += `  x${s.combo}`;
            ctx.font = "700 12px 'Segoe UI', system-ui, sans-serif";
            ctx.lineWidth = 3.5;
            ctx.strokeStyle = "rgba(4,14,22,0.85)";
            ctx.strokeText(label, x, y);
            ctx.fillStyle = headCol(s.id);
            ctx.fillText(label, x, y);

            // Live server-authoritative status under each AI snake's name —
            // structured telemetry (move · length · threats · space) that
            // actually changes tick to tick, not a static "safe".
            const note = notes && notes.get(s.id);
            if (note && !s.isNpc) {
              const txt = fmtNote(note);
              if (txt) {
                ctx.font = "600 10.5px 'Segoe UI', system-ui, sans-serif";
                ctx.lineWidth = 3;
                ctx.strokeStyle = "rgba(4,14,22,0.8)";
                ctx.strokeText(txt, x, y + 13);
                ctx.fillStyle = noteColour(note);
                ctx.fillText(txt, x, y + 13);
              }
            }
          }
        }
        drawThinking();
        updateDelibHud();
      }
      const NOTE_COL = {
        safe: "#9fe6c2", risky: "#ffd27a", blunder: "#ff8f8f",
        timeout: "#c9a0ff", illegal: "#ff8f8f",
      };
      const ARROW = { up: "↑", down: "↓", left: "←", right: "→" };
      // Per-snake overlay: lead with the agent's *declared* intent (one short
      // token, optionally a target), so it actually says what the agent is doing.
      // Falls back to structured telemetry when an agent declares nothing.
      function fmtNote(n) {
        if (!n) return "";
        if (n.kind === "timeout") return "timed out";
        if (n.kind === "illegal") return "illegal move";
        const arrow = ARROW[n.move] || "";
        if (n.intent) {
          const tgt = n.target ? " → " + n.target : "";
          const mark = n.intentOk === false ? " (?)" : "";
          return `${arrow} ${n.intent}${tgt}${mark}`.trim();
        }
        const parts = [];
        if (n.len != null) parts.push("len " + n.len);
        if (n.threats) parts.push(n.threats + " near");
        const body = parts.length ? parts.join(" · ") : "no intent declared";
        return (arrow ? arrow + " " : "") + body;
      }
      // Amber when the declared intent doesn't match the board; otherwise colour
      // by the server's move classification.
      function noteColour(n) {
        if (n.intent && n.intentOk === false) return "#ffd27a";
        return NOTE_COL[n.kind] || "#cfe6f4";
      }

      // Per-agent "deliberation" overlay during the thinking window: a pulsing
      // amber ring while the model is still thinking, switching to a steady green
      // ring + tick the instant it locks in. Only agents (never NPCs) appear here.
      function drawThinking() {
        if (!think || !cur) return;
        for (const s of cur.snakes) {
          if (!s.alive || !s.body.length || !think.ids.has(s.id)) continue;
          if (!think.locked.has(s.id)) continue; // no ring while thinking — keep the board readable
          const h = interpHead(s);
          const x = sx(h.x), y = sy(h.y);
          const baseR = Math.max(7, cam.scale * 0.95);
          // A small green check above the head = locked in. No surrounding ring or
          // pulse, so an agent's actual move stays easy to read.
          ctx.save();
          ctx.strokeStyle = "#7df0b0";
          ctx.lineWidth = Math.max(1.6, cam.scale * 0.17);
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          const cy = y - baseR * 1.1;
          ctx.beginPath();
          ctx.moveTo(x - baseR * 0.32, cy);
          ctx.lineTo(x - baseR * 0.06, cy + baseR * 0.28);
          ctx.lineTo(x + baseR * 0.36, cy - baseR * 0.3);
          ctx.stroke();
          ctx.restore();
        }
      }

      // HUD chip: "Deliberating L/N · Xs" counting down the ceiling. The count
      // usually completes (all locked in) well before the timer runs out.
      function applyDeliberation(d) {
        if (!d) { think = null; return; }
        // Server `started_at` keeps the countdown accurate after refresh/reconnect.
        const elapsed = Date.now() - (d.started_at || Date.now());
        think = {
          tick: d.tick,
          ceiling: d.ceiling_ms || 10000,
          start: performance.now() - elapsed,
          ids: new Set((d.agents || []).map((a) => a.id)),
          names: new Map((d.agents || []).map((a) => [a.id, a.name])),
          locked: new Set(d.locked || []),
        };
      }
      function updateDelibHud() {
        if (!think) { els.deliberateChip.style.display = "none"; return; }
        const remain = Math.max(0, think.ceiling - (performance.now() - think.start));
        els.delibInfo.textContent =
          `Deliberating ${think.locked.size}/${think.ids.size} · ${(remain / 1000).toFixed(1)}s`;
        els.deliberateChip.style.display = "inline-flex";
      }

      function drawHoneycomb(bx, by, bw, bh) {
        const r = Math.max(14, cam.scale * 5);
        if (r > 220) return;
        ctx.strokeStyle = "rgba(120,180,220,0.05)";
        ctx.lineWidth = 1;
        const dx = r * 1.5, dy = Math.sqrt(3) * r;
        const x0 = bx - ((bx % dx) + dx) % dx;
        let col = Math.round((x0 - bx) / dx);
        for (let x = x0; x <= bx + bw + r; x += dx, col++) {
          const yoff = ((col % 2) + 2) % 2 ? dy / 2 : 0;
          for (let y = by - dy; y <= by + bh + dy; y += dy) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
              const a = (Math.PI / 180) * (60 * i);
              const px = x + r * Math.cos(a);
              const py = y + yoff + r * Math.sin(a);
              i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();
          }
        }
      }

      function drawSnake(s) {
        const pts = interpBody(s).map((c) => ({ x: sx(c.x), y: sy(c.y) }));
        const wBody = Math.max(2, cam.scale * 0.92);
        const followed = s.id === follow;

        if (pts.length > 1) {
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          if (followed) {
            ctx.save();
            ctx.shadowColor = "#fff";
            ctx.shadowBlur = Math.max(6, cam.scale);
            ctx.strokeStyle = "rgba(255,255,255,0.85)";
            ctx.lineWidth = wBody + Math.max(2, cam.scale * 0.36);
            strokePath(pts);
            ctx.restore();
          }
          ctx.strokeStyle = darkCol(s.id);
          ctx.lineWidth = wBody + Math.max(1, cam.scale * 0.18);
          strokePath(pts);
          ctx.strokeStyle = bodyCol(s.id);
          ctx.lineWidth = wBody;
          strokePath(pts);
        }

        const h = pts[0];
        const hr = wBody * 0.62;
        ctx.fillStyle = darkCol(s.id);
        ctx.beginPath(); ctx.arc(h.x, h.y, hr + Math.max(0.5, cam.scale * 0.09), 0, 7); ctx.fill();
        ctx.fillStyle = headCol(s.id);
        ctx.beginPath(); ctx.arc(h.x, h.y, hr, 0, 7); ctx.fill();

        if (cam.scale >= 4) {
          const dir = headingVec(pts);
          const px = -dir.y, py = dir.x;
          const eo = hr * 0.45, fo = hr * 0.35, er = Math.max(1, hr * 0.32);
          for (const sgn of [-1, 1]) {
            const ex = h.x + dir.x * fo + px * eo * sgn;
            const ey = h.y + dir.y * fo + py * eo * sgn;
            ctx.fillStyle = "#fff";
            ctx.beginPath(); ctx.arc(ex, ey, er, 0, 7); ctx.fill();
            ctx.fillStyle = "#10222e";
            ctx.beginPath(); ctx.arc(ex + dir.x * er * 0.4, ey + dir.y * er * 0.4, er * 0.55, 0, 7); ctx.fill();
          }
        }
      }

      function headingVec(pts) {
        if (pts.length < 2) return { x: 1, y: 0 };
        const dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
        const m = Math.hypot(dx, dy) || 1;
        return { x: dx / m, y: dy / m };
      }
      function strokePath(pts) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.stroke();
      }

      // --- minimap ---
      function drawMinimap() {
        const MS = 160;
        const s = Math.min(MS / world.width, MS / world.height);
        const ox = (MS - world.width * s) / 2;
        const oy = (MS - world.height * s) / 2;
        mctx.clearRect(0, 0, MS, MS);
        mctx.fillStyle = "#0a1a29";
        mctx.fillRect(ox, oy, world.width * s, world.height * s);

        if (obstacles.length && obstacles.length < 4000) {
          mctx.fillStyle = "rgba(80,110,140,0.7)";
          for (const o of obstacles) mctx.fillRect(ox + o.x * s, oy + o.y * s, Math.max(1, s), Math.max(1, s));
        }
        if (cur) {
          // Draw a faint trail of each snake's body, then a bright head dot.
          for (const sn of cur.snakes) {
            if (!sn.alive || !sn.body.length) continue;
            mctx.strokeStyle = bodyCol(sn.id);
            mctx.globalAlpha = 0.5;
            mctx.lineWidth = 1;
            mctx.beginPath();
            sn.body.forEach((c, i) => {
              const mx = ox + (c.x + 0.5) * s, my = oy + (c.y + 0.5) * s;
              i ? mctx.lineTo(mx, my) : mctx.moveTo(mx, my);
            });
            mctx.stroke();
            mctx.globalAlpha = 1;
          }
          for (const sn of cur.snakes) {
            if (!sn.alive || !sn.body.length) continue;
            const followed = sn.id === follow;
            mctx.fillStyle = followed ? "#fff" : headCol(sn.id);
            const hd = sn.body[0];
            mctx.beginPath();
            mctx.arc(ox + (hd.x + 0.5) * s, oy + (hd.y + 0.5) * s, followed ? 3.5 : 2.2, 0, 7);
            mctx.fill();
          }
        }
        // Viewport rectangle.
        const vx0 = ox + worldX(0) * s, vy0 = oy + worldY(0) * s;
        const vw = (W / cam.scale) * s, vh = (H / cam.scale) * s;
        mctx.strokeStyle = "rgba(95,208,255,0.9)";
        mctx.lineWidth = 1.5;
        mctx.strokeRect(vx0, vy0, vw, vh);
      }

      mini.addEventListener("click", (e) => {
        const rect = mini.getBoundingClientRect();
        const MS = 160;
        const s = Math.min(MS / world.width, MS / world.height);
        const ox = (MS - world.width * s) / 2;
        const oy = (MS - world.height * s) / 2;
        camT.x = (e.clientX - rect.left - ox) / s;
        camT.y = (e.clientY - rect.top - oy) / s;
        mode = "free";
        follow = null;
        els.followChip.classList.remove("on");
      });

      // --- pan / zoom / click-to-follow ---
      let down = false, moved = false, lastX = 0, lastY = 0;
      canvas.addEventListener("mousedown", (e) => {
        down = true; moved = false; lastX = e.clientX; lastY = e.clientY;
        canvas.classList.add("dragging");
      });
      window.addEventListener("mousemove", (e) => {
        if (!down) return;
        const ddx = e.clientX - lastX, ddy = e.clientY - lastY;
        if (Math.abs(ddx) + Math.abs(ddy) > 3) moved = true;
        lastX = e.clientX; lastY = e.clientY;
        cam.x -= ddx / cam.scale; cam.y -= ddy / cam.scale;
        camT.x = cam.x; camT.y = cam.y;
        mode = "free";
        follow = null;
        els.followChip.classList.remove("on");
      });
      window.addEventListener("mouseup", () => {
        canvas.classList.remove("dragging");
        if (down && !moved) hitFollow(lastX, lastY);
        down = false;
      });

      function hitFollow(px, py) {
        if (!cur) return;
        const wx = worldX(px), wy = worldY(py);
        let best = null, bestD = 9;
        for (const s of cur.snakes) {
          if (!s.alive || !s.body.length) continue;
          for (const c of s.body) {
            const d = (c.x + 0.5 - wx) ** 2 + (c.y + 0.5 - wy) ** 2;
            if (d < bestD) { bestD = d; best = s.id; }
          }
        }
        if (best) setFollow(best);
        else setMode("full");
      }

      function zoomAt(px, py, factor) {
        const wx = worldX(px), wy = worldY(py);
        camT.scale = cam.scale = Math.max(1, Math.min(40, cam.scale * factor));
        // keep the point under the cursor fixed
        cam.x = wx - (px - W / 2) / cam.scale;
        cam.y = wy - (py - H / 2) / cam.scale;
        camT.x = cam.x; camT.y = cam.y;
        if (mode !== "follow") mode = "free";
      }
      canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1 / 1.12);
      }, { passive: false });

      document.getElementById("btnFull").onclick = () => setMode("full");
      document.getElementById("btnFit").onclick = () => setMode("fit");
      document.getElementById("btnIn").onclick = () => zoomAt(W / 2, H / 2, 1.25);
      document.getElementById("btnOut").onclick = () => zoomAt(W / 2, H / 2, 1 / 1.25);
      document.getElementById("unfollow").onclick = () => setMode("full");
      window.addEventListener("keydown", (e) => {
        if (e.key === "f" || e.key === "F") setMode("fit");
        else if (e.key === "c" || e.key === "C") setMode("full");
        else if (e.key === "+" || e.key === "=") zoomAt(W / 2, H / 2, 1.25);
        else if (e.key === "-" || e.key === "_") zoomAt(W / 2, H / 2, 1 / 1.25);
        else if (e.key === "Escape") setMode("full");
      });

      // --- leaderboard (paged) ---
      let lbPage = 0;
      const LB_PAGE = 10;

      function renderLeaderboard() {
        if (!cur) return;
        const snakes = cur.snakes;
        const obj = (currentRules && currentRules.objective) || "survive";
        const METRIC = {
          survive: "length", grow: "peak length", kills: "kills",
          zone: "zone ticks", relay: "waypoints", bell: "length", fasting: "length (smallest wins)",
        };
        const metricEl = document.getElementById("lbMetric");
        if (metricEl) metricEl.textContent = "by " + (METRIC[obj] || "length");
        // The number shown per snake is its standing on the round's win condition.
        // The server computes this into `score`; plain survival has none, so fall
        // back to current length there.
        const val = (s) => (s.score != null ? s.score : s.size);
        const aliveFirst = (a, b) => (b.alive ? 1 : 0) - (a.alive ? 1 : 0);
        // Mirror the arena's end-of-round ranking so the live board previews the result.
        const cmp = (a, b) => {
          switch (obj) {
            case "grow": return b.peakSize - a.peakSize || aliveFirst(a, b);
            case "kills":
            case "zone":
            case "relay": return val(b) - val(a) || aliveFirst(a, b) || b.peakSize - a.peakSize;
            case "bell": return aliveFirst(a, b) || b.size - a.size;
            case "fasting": return aliveFirst(a, b) || a.size - b.size;
            default: return aliveFirst(a, b) || b.peakSize - a.peakSize; // survive
          }
        };
        const sorted = [...snakes].sort(cmp);
        els.alive.textContent = snakes.filter((s) => s.alive).length;

        const pages = Math.max(1, Math.ceil(sorted.length / LB_PAGE));
        lbPage = Math.min(Math.max(lbPage, 0), pages - 1);
        const start = lbPage * LB_PAGE;
        const pageRows = sorted.slice(start, start + LB_PAGE);

        els.lb.innerHTML = "";
        pageRows.forEach((s, i) => {
          const rank = start + i + 1;
          const row = document.createElement("div");
          row.className = "lbrow" + (s.id === follow ? " followed" : "") + (s.alive ? "" : " dead");
          row.innerHTML =
            `<span class="rk">${rank}</span>` +
            `<span class="sw" style="background:${bodyCol(s.id)};color:${bodyCol(s.id)}"></span>` +
            `<span class="nm">${escapeHtml(s.displayName)}</span>` +
            (s.isNpc ? "" : `<span class="ai">AI</span>`) +
            `<span class="sz">${val(s)}</span>`;
          row.onclick = () => setFollow(s.id);
          els.lb.appendChild(row);
        });

        if (sorted.length > LB_PAGE) {
          const from = start + 1;
          const to = Math.min(start + LB_PAGE, sorted.length);
          els.lbPager.style.display = "flex";
          els.lbPager.innerHTML =
            `<button class="pgbtn" id="lbPrev"${lbPage === 0 ? " disabled" : ""}>‹</button>` +
            `<span class="pginfo">${from}–${to} of ${sorted.length}</span>` +
            `<button class="pgbtn" id="lbNext"${lbPage >= pages - 1 ? " disabled" : ""}>›</button>`;
          els.lbPager.querySelector("#lbPrev").onclick = () => {
            lbPage -= 1;
            renderLeaderboard();
          };
          els.lbPager.querySelector("#lbNext").onclick = () => {
            lbPage += 1;
            renderLeaderboard();
          };
        } else {
          els.lbPager.style.display = "none";
          els.lbPager.innerHTML = "";
        }
      }

      let stPage = 0;
      const ST_PAGE = 10;
      let lastBoard = null;
      let lastDeltas = {}; // account -> conservative-rating change from the last round

      function applyDeltas(deltas) {
        if (!deltas) return;
        lastDeltas = {};
        for (const d of deltas) lastDeltas[d.account] = d.delta;
      }

      function renderStats(board) {
        if (board) lastBoard = board;
        board = lastBoard;
        if (!board) return;
        if (!board.length) {
          els.stats.innerHTML = `<div class="strow" style="color:#6f97ae">No games recorded yet.</div>`;
          els.statsPager.style.display = "none";
          els.statsPager.innerHTML = "";
          return;
        }

        const pages = Math.max(1, Math.ceil(board.length / ST_PAGE));
        stPage = Math.min(Math.max(stPage, 0), pages - 1);
        const start = stPage * ST_PAGE;
        const pageRows = board.slice(start, start + ST_PAGE);

        let html = `<div class="strow head"><span class="rk">#</span><span class="nm">account</span><span class="v">rating</span><span class="dlt">±</span><span class="v">quality</span><span class="v">win%</span></div>`;
        pageRows.forEach((s, i) => {
          const rating = Math.round(s.conservativeRating ?? 0);
          const ratingCell = s.provisional ? `${rating}?` : `${rating}`;
          const quality = s.decisionQuality == null ? "—" : s.decisionQuality;
          const winPct = Math.round((s.winRate ?? 0) * 100);
          const d = lastDeltas[s.account];
          const dCls = d == null || d === 0 ? "flat" : d > 0 ? "up" : "down";
          const dTxt = d == null ? "" : d === 0 ? "·" : (d > 0 ? "▲" : "▼") + Math.abs(d);
          html +=
            `<div class="strow">` +
            `<span class="rk">${start + i + 1}</span>` +
            `<span class="nm">${escapeHtml(s.account)}</span>` +
            `<span class="v win"${s.provisional ? ' title="provisional — not enough games yet"' : ""}>${ratingCell}</span>` +
            `<span class="dlt ${dCls}">${dTxt}</span>` +
            `<span class="v max">${quality}</span>` +
            `<span class="v">${winPct}</span>` +
            `</div>`;
        });
        els.stats.innerHTML = html;

        if (board.length > ST_PAGE) {
          const from = start + 1;
          const to = Math.min(start + ST_PAGE, board.length);
          els.statsPager.style.display = "flex";
          els.statsPager.innerHTML =
            `<button class="pgbtn" id="stPrev"${stPage === 0 ? " disabled" : ""}>‹</button>` +
            `<span class="pginfo">${from}–${to} of ${board.length}</span>` +
            `<button class="pgbtn" id="stNext"${stPage >= pages - 1 ? " disabled" : ""}>›</button>`;
          els.statsPager.querySelector("#stPrev").onclick = () => {
            stPage -= 1;
            renderStats();
          };
          els.statsPager.querySelector("#stNext").onclick = () => {
            stPage += 1;
            renderStats();
          };
        } else {
          els.statsPager.style.display = "none";
          els.statsPager.innerHTML = "";
        }
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) =>
          ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]),
        );
      }

      // --- active rule card ---
      const OBJ_LABEL = {
        survive: "Last alive wins", grow: "Grow biggest", kills: "Most kills",
        zone: "Hold the zone", relay: "Waypoint race", bell: "Longest at the bell",
        fasting: "Stay smallest",
      };
      const FOOD_LABEL = { normal: "Normal food", scarce: "Scarce food", feast: "Food feast" };
      function pill(text, warn) {
        return `<span class="pill${warn ? " warn" : ""}">${escapeHtml(text)}</span>`;
      }
      function renderRules(r) {
        if (!r) return;
        currentRules = r;
        const mods = Array.isArray(r.modifiers) ? r.modifiers : [];
        const laws = Array.isArray(r.laws) ? r.laws : [];
        els.ruleName.textContent =
          (r.name || "—") + (mods.length ? " +" + mods.length : "") + (laws.length ? " ⚖" + laws.length : "");
        // Card brief, each active twist, then each LAW on its own emphasised line.
        let briefHtml = `<span>${escapeHtml(r.brief || "")}</span>`;
        for (const m of mods) {
          briefHtml += `<br><span class="modBrief">▸ ${escapeHtml(m.brief)}</span>`;
        }
        for (const l of laws) {
          briefHtml += `<br><span class="modBrief" style="color:#ff9f6b">⚖ ${escapeHtml(l.brief)}</span>`;
        }
        els.ruleBrief.innerHTML = briefHtml;
        els.rulePills.innerHTML =
          pill(OBJ_LABEL[r.objective] || r.objective, r.objective !== "survive") +
          pill(FOOD_LABEL[r.food] || r.food, r.food === "scarce") +
          (r.food_grows === false ? pill("Food doesn't feed you", true) : "") +
          (r.poison_value ? pill("Big food = poison ☠", true) : "") +
          (r.bell_tick ? pill((r.objective === "bell" ? "Bell @ tick " : "Ends @ tick ") + r.bell_tick, true) : "") +
          mods.map((m) => pill(m.name, true)).join("") +
          laws.map((l) => pill("⚖ " + l.title, true)).join("");

        // Round-aware legend: only show board elements that exist this round, so
        // spectators always know what every marker means without clutter.
        const dyn = document.getElementById("legdyn");
        if (dyn) {
          const entries = [];
          if (mods.some((m) => m.id === "golden_apple"))
            entries.push('<i style="background:#ffd700;box-shadow:0 0 8px #ffd700"></i>golden apple +12');
          if (r.objective === "zone")
            entries.push('<i style="background:rgba(86,204,242,0.55);border:1px solid #56ccf2;border-radius:2px"></i>scoring zone');
          if (r.objective === "relay")
            entries.push('<i style="background:transparent;border:2px solid #ffd24a;box-shadow:none"></i>✦ waypoint');
          if (r.poison_value)
            entries.push('☠ $/&amp; food = poison');
          if (laws.some((l) => l.kind === "cadence"))
            entries.push('<i style="background:#9fe2ff;box-shadow:0 0 8px #7dd3ff;border-radius:50%"></i>TIDE beacon — move closer on cadence ticks');
          if (laws.length)
            entries.push('⚖ law in force — read the rules panel');
          dyn.innerHTML = entries.map((e) => `&nbsp;<span class="dotleg">${e}</span>`).join("");
        }
      }

      function setWorld(w) {
        const changed = w.width !== world.width || w.height !== world.height;
        world = w;
        if (changed) camReady = false; // re-frame for a new round size
        applyMode();
        if (!camReady) { cam = { ...camT }; camReady = true; }
      }

      function ingestFrame(f, notes) {
        f.recvT = performance.now();
        f.byId = new Map(f.snakes.map((s) => [s.id, s]));
        f.notes = notes ? new Map(notes.map((n) => [n.id, n])) : null;
        if (cur) {
          const gap = f.recvT - cur.recvT;
          if (gap > 100 && gap < 6000) tickMs = gap;
        }
        prev = cur;
        cur = f;
      }

      // --- between-round countdown ---
      let countdownTimer = null;
      function clearCountdown() {
        if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
      }
      function startCountdown(baseText, ms) {
        clearCountdown();
        let remaining = Math.ceil(ms / 1000);
        const tick = () => {
          if (remaining <= 0) { clearCountdown(); els.status.textContent = baseText; return; }
          els.status.textContent = `${baseText} · next round in ${remaining}s`;
          remaining -= 1;
        };
        tick();
        countdownTimer = setInterval(tick, 1000);
      }

      // --- live kill / commentary feed (game events only — no per-tick chatter) ---
      let feed = []; // { key, html, kind, t }
      let feedKey = 0;
      const FEED_MAX = 6;
      const FEED_TTL = 7000;
      const FEED_FADE = 1400; // final stretch over which a row fades to nothing

      function pushFeed(html, kind) {
        feed.push({ key: ++feedKey, html, kind, t: performance.now() });
        if (feed.length > FEED_MAX) feed.shift();
        renderFeed();
      }
      function nm(name, id) {
        return `<b style="color:${id ? headCol(id) : "#eaf4fb"}">${escapeHtml(name)}</b>`;
      }
      // --- caster: turn the server's per-move notes into occasional commentary.
      // Selective + throttled so it reads like a commentator, not a log: only
      // notable moments (blunders, timeouts, illegal moves) and at most one line
      // per snake per few seconds (deduped by what happened).
      const sayState = new Map(); // id -> last notable category emitted (null when not notable)
      function casterFromNotes(notes) {
        if (!notes) return;
        for (const [id, n] of notes) {
          if (!n) continue;
          let key = null, html = null;
          if (n.kind === "timeout") {
            key = "timeout";
            html = `${nm(n.name, id)} ran out of thinking time`;
          } else if (n.kind === "illegal") {
            key = "illegal";
            html = `${nm(n.name, id)} tried an illegal move`;
          } else if (n.kind === "blunder") {
            key = "blunder";
            html = `${nm(n.name, id)} stepped into danger — a safe move existed`;
          }
          // Edge-triggered: only announce when a snake first *enters* a notable
          // state. While it stays in (or returns straight to) the same state we
          // stay quiet, so a line appears once, fades, and does not flash back.
          // Returning to a safe move resets it, so a later relapse is announced.
          const prev = sayState.get(id) ?? null;
          if (key && key !== prev) pushFeed(html, "say");
          sayState.set(id, key);
        }
      }
      function ingestEvents(events) {
        if (!events) return;
        for (const e of events) {
          if (e.kind === "kill") {
            pushFeed(`${nm(e.displayName, e.id)} ate ${nm(e.victimName, e.victim)} <span style="color:#ffd54a">+${e.amount}</span>`, "kill");
          } else if (e.kind === "death" && !e.isNpc) {
            const how = { wall: "hit a wall", obstacle: "hit an obstacle", body: "ran into a snake", head2head: "lost a head-to-head", poison: "ate poison ☠", unlawful: "broke the law ⚖" }[e.cause] || "died";
            pushFeed(`${nm(e.displayName, e.id)} ${how}`, "death");
          } else if (e.kind === "waypoint" && !e.isNpc) {
            pushFeed(`${nm(e.displayName, e.id)} reached waypoint ${e.index} ✦`, "frenzy");
          }
        }
      }
      // Reconcile by key rather than rebuilding innerHTML: existing rows keep
      // their DOM node (so the feedIn entry animation only plays once, on first
      // appearance) and we just nudge their opacity. Rebuilding wholesale every
      // tick was replaying that 0→1 animation on every row, which is what made
      // the lines flash once a second.
      function renderFeed() {
        const now = performance.now();
        feed = feed.filter((f) => now - f.t < FEED_TTL);
        const live = new Set();
        for (const f of feed) {
          live.add(String(f.key));
          const age = now - f.t;
          const op = age > FEED_TTL - FEED_FADE ? Math.max(0, (FEED_TTL - age) / FEED_FADE) : 1;
          let row = els.feed.querySelector(`[data-key="${f.key}"]`);
          if (!row) {
            row = document.createElement("div");
            row.className = `feedrow ${f.kind}`;
            row.dataset.key = String(f.key);
            row.innerHTML = f.html;
            els.feed.appendChild(row);
          }
          row.style.opacity = String(op);
        }
        for (const row of [...els.feed.children]) {
          if (!live.has(row.dataset.key)) row.remove();
        }
      }
      setInterval(renderFeed, 300);

      function connect() {
        const ws = new WebSocket(`ws://${location.host}/spectate`);
        ws.onopen = () => (els.status.textContent = "Connected");
        ws.onmessage = (ev) => {
          const msg = JSON.parse(ev.data);
          if (msg.type === "init") {
            obstacles = msg.obstacles || [];
            setWorld(msg.world);
            ingestFrame(msg.frame);
            renderRules(msg.rules);
            if (msg.round != null) els.round.textContent = msg.round;
            if (msg.frame) els.tick.textContent = msg.frame.tick;
            applyDeliberation(msg.deliberation);
          } else if (msg.type === "round_start") {
            clearCountdown();
            think = null;
            sayState.clear();
            obstacles = msg.obstacles || [];
            prev = null; cur = null;
            feed = []; renderFeed();
            setWorld(msg.world);
            renderRules(msg.rules);
            els.round.textContent = msg.round;
          } else if (msg.type === "frame") {
            think = null; // reveal: drop the thinking overlay until the next window
            ingestFrame(msg.frame, msg.notes);
            ingestEvents(msg.events);
            casterFromNotes(cur.notes);
            els.tick.textContent = msg.frame.tick;
          } else if (msg.type === "deliberation") {
            applyDeliberation(msg);
          } else if (msg.type === "locked_in") {
            if (think && msg.tick === think.tick) think.locked.add(msg.id);
          } else if (msg.type === "leaderboard") {
            applyDeltas(msg.deltas);
            renderStats(msg.board);
            return;
          } else if (msg.type === "round_end") {
            think = null;
            if (msg.rules) renderRules(msg.rules);
            const why = {
              all_dead: "everyone died",
              last_standing: "last snake standing",
              agents_eliminated: "all agents out",
              time_limit: "time limit",
              stalemate: "stalemate",
              bell: "the bell",
              objective_complete: "objective complete",
            }[msg.reason] || msg.reason || "";
            const top = msg.standings[0]?.display_name ?? "?";
            const base = `Round ${msg.round}: ${top} won${why ? " (" + why + ")" : ""}`;
            // Round-end highlights in the feed.
            const h = msg.highlights;
            if (h) {
              if (h.survivor) {
                pushFeed(`🏆 ${nm(h.survivor.name)} survived to tick ${h.survivor.ticks}`, "frenzy");
              }
              if (h.topKiller) {
                pushFeed(`🔥 ${nm(h.topKiller.name)} — ${h.topKiller.kills} kill${h.topKiller.kills === 1 ? "" : "s"}`, "kill");
              }
            }
            if (msg.next_round_in_ms) startCountdown(base, msg.next_round_in_ms);
            else els.status.textContent = base;
          }
          if (cur) renderLeaderboard();
        };
        ws.onclose = () => {
          els.status.textContent = "Disconnected — retrying…";
          setTimeout(connect, 1000);
        };
      }

      window.addEventListener("resize", resize);
      resize();
      setMode("full");
      connect();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
