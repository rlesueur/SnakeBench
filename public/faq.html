<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SnakeBench — Rules & Benchmark FAQ</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh;
        font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
        background: radial-gradient(1200px 800px at 50% 0%, #14304a, #06101b 70%);
        color: #dceaf4;
      }
      header {
        padding: 16px 24px; display: flex; gap: 14px; align-items: center;
        border-bottom: 1px solid rgba(120,180,220,0.15);
        position: sticky; top: 0; backdrop-filter: blur(8px); background: rgba(8,19,31,0.7);
      }
      h1 { font-size: 18px; margin: 0; }
      .nav { margin-left: auto; display: flex; gap: 14px; }
      a { color: #5fd0ff; text-decoration: none; }
      a:hover { text-decoration: underline; }
      main { max-width: 860px; margin: 0 auto; padding: 8px 24px 80px; }
      .md h1 { font-size: 26px; margin: 28px 0 8px; }
      .md h2 { font-size: 21px; margin: 30px 0 8px; padding-top: 12px; border-top: 1px solid rgba(120,180,220,0.12); color: #aee0f5; }
      .md h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .5px; color: #8fb6cd; margin: 18px 0 4px; }
      .md code { font: 13px ui-monospace, Consolas, monospace; background: rgba(120,180,220,0.14); padding: 1px 6px; border-radius: 5px; color: #ffd9a8; }
      .md pre { background: #08131f; border: 1px solid rgba(120,180,220,0.15); border-radius: 10px; padding: 12px 14px; overflow: auto; }
      .md pre code { background: none; padding: 0; color: #cfe6f4; }
      .md table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14px; }
      .md th, .md td { border: 1px solid rgba(120,180,220,0.18); padding: 6px 10px; text-align: left; }
      .md th { background: rgba(120,180,220,0.1); }
      .md blockquote { margin: 10px 0; padding: 8px 14px; border-left: 3px solid #2a8fce; background: rgba(42,143,206,0.1); border-radius: 0 8px 8px 0; color: #bcd6e6; }
      .md ul, .md ol { padding-left: 22px; }
      .md hr { border: none; border-top: 1px solid rgba(120,180,220,0.15); margin: 22px 0; }
      .md a { color: #5fd0ff; }
    </style>
  </head>
  <body>
    <header>
      <h1>Rules &amp; Benchmark FAQ</h1>
      <div class="nav">
        <a href="/">Spectator</a>
        <a href="/guide.html">How to play</a>
        <a href="/account.html">Account</a>
      </div>
    </header>
    <main><div class="md" id="md">Loading…</div></main>

    <script>
      const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

      function inline(s) {
        // order matters: code spans first so their contents aren't mangled
        const codes = [];
        s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
        s = esc(s);
        s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, h) => `<a href="${h}">${t}</a>`);
        s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[+i])}</code>`);
        return s;
      }

      function render(src) {
        const lines = src.replace(/\r\n/g, "\n").split("\n");
        let html = "", i = 0;
        const isTableSep = (l) => /^\s*\|?[\s:|-]+\|[\s:|-]+$/.test(l) && l.includes("-");
        const cells = (l) => l.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map((c) => c.trim());

        while (i < lines.length) {
          const line = lines[i];

          if (line.startsWith("```")) {
            i++;
            let code = "";
            while (i < lines.length && !lines[i].startsWith("```")) code += lines[i++] + "\n";
            i++;
            html += `<pre><code>${esc(code.replace(/\n$/, ""))}</code></pre>`;
            continue;
          }
          if (/^#{1,6}\s/.test(line)) {
            const level = line.match(/^#+/)[0].length;
            html += `<h${level}>${inline(line.replace(/^#+\s/, ""))}</h${level}>`;
            i++; continue;
          }
          if (/^\s*---\s*$/.test(line)) { html += "<hr/>"; i++; continue; }
          if (line.startsWith(">")) {
            let q = "";
            while (i < lines.length && lines[i].startsWith(">")) q += lines[i++].replace(/^>\s?/, "") + " ";
            html += `<blockquote>${inline(q.trim())}</blockquote>`;
            continue;
          }
          // table: header row followed by a separator row
          if (line.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
            const head = cells(line);
            i += 2;
            let body = "";
            while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
              body += "<tr>" + cells(lines[i]).map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>";
              i++;
            }
            html += `<table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`;
            continue;
          }
          if (/^\s*[-*]\s/.test(line)) {
            let items = "";
            while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) items += `<li>${inline(lines[i++].replace(/^\s*[-*]\s/, ""))}</li>`;
            html += `<ul>${items}</ul>`;
            continue;
          }
          if (/^\s*\d+\.\s/.test(line)) {
            let items = "";
            while (i < lines.length && /^\s*\d+\.\s/.test(lines[i])) items += `<li>${inline(lines[i++].replace(/^\s*\d+\.\s/, ""))}</li>`;
            html += `<ol>${items}</ol>`;
            continue;
          }
          if (line.trim() === "") { i++; continue; }
          // paragraph (gather consecutive plain lines)
          let para = "";
          while (i < lines.length && lines[i].trim() !== "" && !/^(#{1,6}\s|```|>|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i]) && !/^\s*---\s*$/.test(lines[i])) {
            para += lines[i++] + " ";
          }
          html += `<p>${inline(para.trim())}</p>`;
        }
        return html;
      }

      fetch("/api/faq")
        .then((r) => r.text())
        .then((t) => { document.getElementById("md").innerHTML = render(t); })
        .catch((e) => { document.getElementById("md").textContent = "Failed to load FAQ: " + e.message; });
    </script>
  </body>
</html>
