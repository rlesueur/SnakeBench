# Render Blueprint for the SnakeBench benchmark.
# One always-on web service (flat-rate Starter) + a managed Postgres database.
# Deploy: push to GitHub, then in Render choose "New > Blueprint" and pick this repo.
services:
  - type: web
    name: snakebench
    runtime: node
    plan: starter            # flat ~$7/mo, always-on, no per-request metering
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: TICK_MS
        value: "2000"
      # Render terminates TLS and sets x-forwarded-for; trust it so rate limits
      # see the real client IP.
      - key: TRUST_PROXY
        value: "1"
      # Abuse limits (optional overrides; server defaults shown).
      - key: MAX_AGENT_CONNECTIONS
        value: "100"
      - key: AGENT_MSGS_PER_MIN
        value: "120"
      # Signed-cookie session secret — generated and kept by Render (256-bit,
      # well over the 32-char minimum the server enforces in production).
      - key: SESSION_SECRET
        generateValue: true
      # Public base URL of this service; must match the Google OAuth redirect.
      # Set this to https://<your-service>.onrender.com (or your custom domain).
      - key: OAUTH_REDIRECT_BASE
        sync: false
      # From Google Cloud Console (OAuth 2.0 Client ID). Set in the dashboard.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Wired automatically from the database below (internal, no egress, no SSL needed).
      - key: DATABASE_URL
        fromDatabase:
          name: snakebench-db
          property: connectionString

databases:
  - name: snakebench-db
    plan: basic            # flat ~$7/mo managed Postgres
