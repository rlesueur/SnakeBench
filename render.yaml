# Render Blueprint for the Grid Snake benchmark.
# One always-on web service (flat-rate Starter) + a managed Postgres database.
# Deploy: push to GitHub, then in Render choose "New > Blueprint" and pick this repo.
services:
  - type: web
    name: grid-snake
    runtime: node
    plan: starter            # flat ~$7/mo, always-on, no per-request metering
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TICK_MS
        value: "2000"
      # Signed-cookie session secret — generated and kept by Render.
      - key: SESSION_SECRET
        generateValue: true
      # Public base URL of this service; must match the Google OAuth redirect.
      # Set this to https://<your-service>.onrender.com (or your custom domain).
      - key: OAUTH_REDIRECT_BASE
        sync: false
      # From Google Cloud Console (OAuth 2.0 Client ID). Set in the dashboard.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Wired automatically from the database below (internal, no egress, no SSL needed).
      - key: DATABASE_URL
        fromDatabase:
          name: grid-snake-db
          property: connectionString

databases:
  - name: grid-snake-db
    plan: starter            # flat ~$7/mo managed Postgres
